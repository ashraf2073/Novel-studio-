# Novel Studio — Android APK build — made par ashraf
name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unpack project zip (if you uploaded it as a .zip)
        run: |
          shopt -s nullglob
          for z in *.zip; do
            echo "Unpacking $z"
            unzip -o -q "$z"
          done

      - name: Locate project folder (finds package.json anywhere)
        run: |
          FILE=$(find . -name package.json -not -path '*/node_modules/*' -not -path './android/*' | head -1)
          if [ -z "$FILE" ]; then
            echo "::error::package.json not found in the repo. Upload novel-studio.zip to the repo root."
            exit 1
          fi
          echo "APP_DIR=$(dirname "$FILE")" >> "$GITHUB_ENV"
          echo "Project folder: $(dirname "$FILE")"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install npm dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm install

      - name: Add Android platform
        working-directory: ${{ env.APP_DIR }}
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Add microphone permission
        working-directory: ${{ env.APP_DIR }}
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q RECORD_AUDIO "$MANIFEST"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <application#' "$MANIFEST"
          fi

      - name: Sync web assets into Android
        working-directory: ${{ env.APP_DIR }}
        run: npx cap sync android

      - name: Build debug APK
        working-directory: ${{ env.APP_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp "$APP_DIR/android/app/build/outputs/apk/debug/app-debug.apk" NovelStudio-by-ashraf.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: novel-studio-apk
          path: NovelStudio-by-ashraf.apk
          if-no-files-found: error

      - name: Publish GitHub Release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: NovelStudio-by-ashraf.apk
